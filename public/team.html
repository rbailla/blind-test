<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blind Test DJ Rems — Équipe</title><script src="/socket.io/socket.io.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#eee;margin:0;padding:18px}.wrap{max-width:560px;margin:auto}.card{background:#191919;border:1px solid #333;border-radius:16px;padding:18px;margin-bottom:15px}h1{font-size:26px}.muted{color:#aaa}select,input,textarea{width:100%;box-sizing:border-box;background:#222;color:#fff;border:1px solid #444;border-radius:10px;padding:13px;font-size:17px;margin:8px 0 14px}textarea{min-height:120px}button{width:100%;padding:14px;border:0;border-radius:10px;font-weight:bold;font-size:17px;background:#fff;color:#111}.ok{padding:12px;border-radius:10px;background:#243524;margin-top:12px}.closed{padding:12px;border-radius:10px;background:#382424;margin-top:12px}
</style></head><body><div class="wrap"><div class="card"><h1>Blind Test DJ Rems</h1><div class="muted">Une équipe = un téléphone</div><label>Équipe</label><select id="team"></select><label>Nom de l'équipe</label><input id="name" maxlength="40" placeholder="Ex. Les Vinyls"><button id="join">Rejoindre</button></div>
<div id="game" class="card" style="display:none"><h2>Question <span id="q">1</span></h2><div id="msg" class="muted"></div><textarea id="answer" maxlength="300" placeholder="Artiste + titre, par exemple : Daft Punk — One More Time"></textarea><button id="send">Envoyer ma réponse</button><div id="feedback"></div></div></div>
<script>
const s=io();let teamId=null;const params=new URLSearchParams(location.search),room=params.get('room')||'';const sel=document.getElementById('team');for(let i=1;i<=10;i++){let o=document.createElement('option');o.value='team'+i;o.textContent='Équipe '+i;sel.appendChild(o)}
document.getElementById('join').onclick=()=>{teamId=sel.value;s.emit('team:join',{teamId,room});document.getElementById('game').style.display='block'};
s.on('state',st=>{document.getElementById('q').textContent=st.question;const t=st.teams.find(x=>x.id===teamId);if(t){document.getElementById('name').value=t.name;document.getElementById('msg').textContent=st.accepting?'Écris ta réponse puis valide.':'Les réponses sont fermées.';document.getElementById('send').disabled=!st.accepting;document.getElementById('feedback').className=t.submitted?'ok':'';document.getElementById('feedback').textContent=t.submitted?'Réponse enregistrée. Attends la correction.':''}});
s.on('errorMessage',m=>alert(m));document.getElementById('name').onchange=e=>{if(teamId)s.emit('team:name',{teamId,name:e.target.value})};
document.getElementById('send').onclick=()=>{const answer=document.getElementById('answer').value.trim();if(!teamId||!answer)return;s.emit('team:answer',{teamId,answer});document.getElementById('answer').value=''};
</script></body></html>
